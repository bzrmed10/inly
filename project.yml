name: Inly
options:
  bundleIdPrefix: com.bzrmed
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "${APPLE_TEAM_ID}"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Inly:
    type: application
    platform: iOS
    sources:
      - path: Inly
      - path: Shared
    info:
      path: Inly/Info.plist
      properties:
        CFBundleDisplayName: Inly
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Inly/Inly.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.bzrmed.inly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bzrmed.inly
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Inly CI AppStore"
    dependencies:
      - target: InlyWidgets
        embed: true
  InlyWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: InlyWidgets
      - path: Shared
    info:
      path: InlyWidgets/Info.plist
      properties:
        CFBundleDisplayName: Inly
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: InlyWidgets/InlyWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.bzrmed.inly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bzrmed.inly.widgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Inly CI Widgets AppStore"
  InlyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: InlyTests
    dependencies:
      - target: Inly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bzrmed.inly.tests
        GENERATE_INFOPLIST_FILE: YES
  InlyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: InlyUITests
    dependencies:
      - target: Inly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bzrmed.inly.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Inly
schemes:
  InlyScreenshots:
    build:
      targets:
        Inly: all
        InlyWidgets: all
    test:
      targets:
        - InlyUITests
  Inly:
    build:
      targets:
        Inly: all
        InlyWidgets: all
    test:
      targets:
        - InlyTests
    run:
      config: Debug
    archive:
      config: Release
