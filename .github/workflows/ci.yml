name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install tools
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick simulator
        id: sim
        run: echo "udid=$(bash scripts/ci/select-simulator.sh)" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test \
            -project Inly.xcodeproj \
            -scheme Inly \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath build/Test.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/xcodebuild.log | xcbeautify --renderer github-actions

      - name: Capture screenshots
        run: |
          set -o pipefail
          mkdir -p build/screenshots
          TEST_RUNNER_SCREENSHOT_DIR="$PWD/build/screenshots" xcodebuild test \
            -project Inly.xcodeproj \
            -scheme InlyScreenshots \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath build/UITest.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/uitest.log | xcbeautify --renderer github-actions

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: build/screenshots
          if-no-files-found: ignore

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: |
            build/xcodebuild.log
            build/Test.xcresult
          if-no-files-found: ignore
