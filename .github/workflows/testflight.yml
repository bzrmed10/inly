name: TestFlight

# Run manually: GitHub -> Actions -> TestFlight -> Run workflow.
# Also runs when you push a tag like v0.1.0 or build-1.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "build-*"

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check secrets
        run: |
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!v}" ]; then echo "::error::Missing repository secret $v"; exit 1; fi
          done

      - name: Install tools
        run: |
          brew install xcodegen xcbeautify
          python3 -m venv .venv
          .venv/bin/pip install --quiet pyjwt cryptography requests

      - name: Write App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Create temporary signing certificate and profiles
        run: .venv/bin/python scripts/ci/asc_signing.py setup

      - name: Archive
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive \
            -project Inly.xcodeproj \
            -scheme Inly \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Inly.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            | tee build/archive.log | xcbeautify --renderer github-actions

      - name: Export signed IPA
        run: |
          set -o pipefail
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.bzrmed.inly</key><string>Inly CI AppStore</string>
              <key>com.bzrmed.inly.widgets</key><string>Inly CI Widgets AppStore</string>
              <key>com.bzrmed.inly.watchkitapp</key><string>Inly CI Watch AppStore</string>
              <key>com.bzrmed.inly.watchkitapp.widgets</key><string>Inly CI Watch Widgets AppStore</string>
            </dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/Inly.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            | tee build/export.log | xcbeautify --renderer github-actions

      - name: Inspect signed IPA
        run: |
          ls -la build/export
          rm -rf build/ipa && mkdir -p build/ipa
          unzip -q build/export/Inly.ipa -d build/ipa
          for app in build/ipa/Payload/Inly.app build/ipa/Payload/Inly.app/PlugIns/InlyWidgets.appex; do
            echo "== $app"
            codesign -d --entitlements :- "$app" 2>&1 | grep -A2 "application-groups" || { echo "::error::$app is missing the application-groups entitlement"; exit 1; }
          done

      - name: Check build number inside the IPA
        run: |
          unzip -q -o build/export/Inly.ipa -d build/ipa
          v=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" build/ipa/Payload/Inly.app/Info.plist)
          echo "CFBundleVersion in IPA: $v (expected ${{ github.run_number }})"
          test "$v" = "${{ github.run_number }}"

      - name: Upload to App Store Connect
        run: |
          set -o pipefail
          mkdir -p ~/private_keys
          cp "$ASC_KEY_PATH" ~/private_keys/
          xcrun altool --upload-app --type ios \
            --file build/export/Inly.ipa \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee build/upload.log
          grep -q "UPLOAD SUCCEEDED" build/upload.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            build/archive.log
            build/export.log
            build/upload.log
          if-no-files-found: ignore

      - name: Revoke temporary certificate and profiles
        if: always()
        run: .venv/bin/python scripts/ci/asc_signing.py cleanup

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys" ~/private_keys
